name: th06-build-windows

on:
  workflow_dispatch:

env:
  PREMAKE_VERSION: 5.0.0-beta2

jobs:
  msvc:
    runs-on: windows-latest
    steps:
      - name: Git clone
        run: |
          git clone https://github.com/TC999/th06.git --depth=1 -b portable .

      - name: Install premake5
        shell: pwsh
        run: |
          $url = "https://github.com/premake/premake-core/releases/download/v$env:PREMAKE_VERSION/premake-$env:PREMAKE_VERSION-windows.zip"
          Invoke-WebRequest $url -OutFile premake.zip
          Expand-Archive premake.zip -DestinationPath "$env:RUNNER_TEMP\premake"
          echo "$env:RUNNER_TEMP\premake" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install SDL2 via vcpkg
        shell: pwsh
        run: |
          vcpkg install sdl2 sdl2-image sdl2-ttf --triplet x64-windows
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          # MSVC 会读取 INCLUDE / LIB 环境变量，这样不用改 premake 脚本
          "INCLUDE=$root\include;$root\include\SDL2;$env:INCLUDE" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "LIB=$root\lib;$env:LIB" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VCPKG_BIN=$root\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Generate and build
        shell: pwsh
        run: |
          premake5 vs2022
          $sln = (Get-ChildItem build -Filter *.sln | Select-Object -First 1).FullName
          msbuild $sln /m /p:Configuration=Release

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item out -ItemType Directory
          Get-ChildItem build -Recurse -Filter *.exe | Copy-Item -Destination out
          Copy-Item "$env:VCPKG_BIN\*.dll" out

      - uses: actions/upload-artifact@v4
        with:
          name: eosd-portable-msvc
          path: out

  mingw:
    runs-on: windows-latest
    steps:
      - name: Git clone
        run: |
          git clone https://github.com/TC999/th06.git --depth=1 -b portable .

      - name: Install premake5
        shell: pwsh
        run: |
          $url = "https://github.com/premake/premake-core/releases/download/v$env:PREMAKE_VERSION/premake-$env:PREMAKE_VERSION-windows.zip"
          Invoke-WebRequest $url -OutFile premake.zip
          Expand-Archive premake.zip -DestinationPath "$env:RUNNER_TEMP\premake"
          echo "$env:RUNNER_TEMP\premake" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_ttf

      - name: Generate and build
        shell: msys2 {0}
        run: |
          premake5 gmake
          make -C build -j$(nproc) config=release

      - name: Collect artifacts
        shell: msys2 {0}
        run: |
          mkdir out
          find build -name '*.exe' -exec cp {} out/ \;
          cp /mingw64/bin/{SDL2,SDL2_image,SDL2_ttf}.dll out/

      - uses: actions/upload-artifact@v4
        with:
          name: eosd-portable-mingw
          path: out
