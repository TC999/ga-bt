name: PVZ MUSL BUILD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.22

    steps:
      - name: 安装依赖
        run: |
          apk update
          apk add --no-cache \
          git build-base cmake ninja musl-dev \
          libogg-dev libjpeg-turbo-dev libpng-dev \
          libvorbis-dev mpg123-dev sdl2 sdl2-dev

      - name: 源码编译 openmpt
        run: |
          apk add build-base cmake ninja git \
          flac-dev libogg-dev libvorbis-dev mpg123-dev zlib-dev \
          portaudio-dev pulseaudio-dev
          git clone https://github.com/OpenMPT/openmpt.git --depth=1 -b libopenmpt-0.7.9
          cd openmpt
          make -j$(nproc)
          make install
          ls -la /usr/local/lib/libopenmpt.*

      - name: 检出代码
        run: |
          git clone https://github.com/TC999/PvZ-Portable.git --depth=1 --single-branch -b test
      - name: 配置
        run: |
          cd PvZ-Portable
          mkdir build
          cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DCMAKE_PREFIX_PATH=/usr/local \
          -DCMAKE_FIND_LIBRARY_SUFFIXES=".a" \
          -DCMAKE_EXE_LINKER_FLAGS="-static"
      - name: 编译
        run: |
          cd PvZ-Portable
          cmake --build build
      - name: 上传编译结果
        uses: actions/upload-artifact@v4
        with:
          name: pvz-port-musl
          path: PvZ-Portable/build/pvz-portable
