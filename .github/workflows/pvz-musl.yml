name: PVZ MUSL BUILD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.22

    steps:
      - name: 安装依赖
        run: |
          apk update
          apk add --no-cache \
          git build-base cmake ninja musl-dev \
          libogg-dev libjpeg-turbo-dev libopenmpt-dev libpng-dev \
          libvorbis-dev mpg123-dev sdl2 sdl2-dev

      - name: 检出代码
        run: |
          git clone https://github.com/TC999/PvZ-Portable.git --depth=1 --single-branch -b test .
      - name: 配置
        run: |
          mkdir build
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release
      - name: 编译
        run: |
          cmake --build build
      - name: 上传编译结果
        uses: actions/upload-artifact@v4
        with:
          name: pvz-port-musl
          path: build/pvz-portable
